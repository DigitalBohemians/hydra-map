<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>AR Map – Hydra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --dark: #1a1a1a;
      --text-muted: rgba(26,26,26,0.45);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--dark);
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      position: relative;
      z-index: 1000;
      padding: 16px 20px;
      background: #fff;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--dark);
    }
    .header-text p {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-top: 1px;
    }
    #map { flex: 1; width: 100%; position: relative; }
    .leaflet-popup-content-wrapper {
      background: #fff !important;
      border: none !important;
      border-radius: 16px !important;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06) !important;
      color: var(--dark) !important;
      font-family: 'DM Sans', sans-serif !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button {
      color: #1a1a1a !important;
      font-size: 20px !important;
      top: 12px !important;
      right: 14px !important;
      font-weight: 300 !important;
    }
    .popup-bar { height: 4px; background: linear-gradient(90deg, #a855f7, #a855f7, #22d3ee); }
    .popup-inner { padding: 16px 18px 18px; min-width: 230px; }
    .popup-tag {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .popup-inner h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--dark);
      margin-bottom: 6px;
    }
    .popup-inner p {
      font-size: 13px;
      color: rgba(26,26,26,0.6);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .ar-btn {
      display: block;
      background: #a855f7;
      color: #fff !important;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 12px;
      border-radius: 12px;
    }
    .legend {
      position: absolute;
      bottom: 20px;
      left: 14px;
      z-index: 800;
      background: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .legend-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--dark);
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #a855f7;
      border: 2px solid #1a1a1a;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .legend-dot.white {
      background: #fff;
      border: 2px solid #a855f7;
    }
    .leaflet-tile { filter: grayscale(1) brightness(1.05); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 60 44" fill="none" xmlns="http://www.w3.org/2000/svg" width="38" height="38">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="50%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>
      <circle cx="22" cy="22" r="21" fill="#1a1a1a"/>
      <circle cx="38" cy="22" r="20" fill="none" stroke="url(#g)" stroke-width="2.5"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>AR Map – Hydra</h1>
    <p>DIGITALBOHEMIANS · AUGMENTED REALITY</p>
  </div>
</header>

<div id="map"></div>


<script>
  // ── Hydra Map · Analytics Tracker · Google Sheets ──
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbymATI23PQ9CBvpXEzjV8373FNKheOy-GKT6_VVLrNANp5YvhsSdArm_4Cgp1OlPdHf/exec';

  function track(typ, element, details) {
    try {
      var params = new URLSearchParams({
        seite: 'Map',
        typ: typ,
        element: element || '',
        details: details || '',
        url: ''
      });
      fetch(SHEET_URL + '?' + params.toString(), { mode: 'no-cors' }).catch(function(){});
    } catch(e) {}
  }

  // Seitenaufruf tracken
  track('Seitenaufruf', 'Map', navigator.language || '');
</script>

<script>
  const map = L.map('map', { center: [37.35055, 23.46656], zoom: 15 });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);

  const locations = [
    {
      lat: 37.352643, lng: 23.466445,
      title: "Miaoulia Statue",
      subtitle: "Hydra Artists 2026",
      tag: "AR Art Group Show",
      desc: "Stand in front of the Miaoulia Statue to see it! Tap on Galen's Play Button and listen to the music too.",
      coords: "",
      hint: "📱 Requires the Snapchat app to view.",
      url: "https://www.snapchat.com/unlock/?type=SNAPCODE&uuid=c88f9991f9764d6e99c9fe0d3a3d5c44&metadata=01",
      filled: false,
      style: "purple-white",
      snaplink: true
    },
    {
      lat: 37.348462, lng: 23.466683,
      title: "AR Vavortext Groupshows of the winners",
      tag: "AR Art Group Show",
      desc: "Open the AR experience and discover the group show at this spot.",
      coords: "",
      hint: "📱 Requires the Snapchat app to view.",
      url: "https://www.snapchat.com/lens/72fa3f7abc134a04aa13f596a99f90d5?utm=qr",
      filled: false,
      style: "purple-white",
      snaplink: true
    }
  ];

  function markerSize(zoom) {
    const size = Math.round(8 + zoom * 1.5);
    return Math.max(14, Math.min(size, 44));
  }

  function makeIcon(filled, zoom, style) {
    const s = markerSize(zoom);
    const inner = Math.round(s * 0.68);
    let outerColor = '#a855f7';
    let innerColor = '#1a1a1a';
    if (style === 'purple-white') innerColor = '#ffffff';
    return L.divIcon({
      className: '',
      html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${outerColor};border:${Math.max(2,Math.round(s*0.08))}px solid #1a1a1a;box-sizing:border-box;display:flex;align-items:center;justify-content:center;cursor:pointer;"><div style="width:${inner}px;height:${inner}px;border-radius:50%;background:${innerColor};pointer-events:none;"></div></div>`,
      iconSize: [s, s],
      iconAnchor: [s/2, s/2],
      popupAnchor: [0, -(s/2 + 4)]
    });
  }

  const markers = [];

  locations.forEach((loc) => {
    const marker = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc.filled, map.getZoom(), loc.style) }).addTo(map);

    marker.on('click', function() {
      track('Marker-Klick', loc.title, loc.tag);
    });

    const btnHtml = `<a class="ar-btn" href="${loc.url}" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;padding:16px;" onclick="track('Snap-Klick','${loc.title}','${loc.url}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg> Open Group Show</a>`;

    marker.bindPopup(`
      <div class="popup-bar"></div>
      <div class="popup-inner" style="text-align:left;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;margin-top:8px;padding-right:28px;">
          <div class="popup-tag" style="margin-bottom:0;">${loc.tag}</div>
        </div>
        <h2 style="text-align:left;">${loc.title}</h2>
        ${loc.subtitle ? `<p style="font-size:12px;font-weight:500;color:rgba(26,26,26,0.45);margin-top:2px;margin-bottom:4px;letter-spacing:0.01em;text-align:left;">${loc.subtitle}</p>` : ''}
        ${loc.hint ? `<p style="font-size:12px;color:rgba(26,26,26,0.5);margin-bottom:10px;font-style:italic;text-align:left;">${loc.hint}</p>` : ''}
        ${loc.desc ? `<p style="text-align:left;">${loc.desc}</p>` : ''}
        ${btnHtml}
      </div>
    `, { maxWidth: 290 });

    markers.push({ marker, filled: loc.filled, style: loc.style });
  });

  map.on('zoomend', () => {
    const z = map.getZoom();
    markers.forEach(({ marker, filled, style }) => {
      marker.setIcon(makeIcon(filled, z, style));
      const el = marker.getElement();
      if (el) el.style.display = 'none', el.offsetHeight, el.style.display = '';
    });
  });

  const legendEl = document.createElement('div');
  legendEl.className = 'legend';
  legendEl.innerHTML = `
    <div class="legend-title">Legend</div>
    <div class="legend-item"><span class="legend-dot white"></span> AR Groupshow</div>
  `;
  document.getElementById('map').appendChild(legendEl);
</script>

</body>
</html>
